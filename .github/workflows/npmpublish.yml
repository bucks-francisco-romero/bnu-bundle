name: Publish to npm (trusted workflow)

on:
  release:
    types: [published]   # keeps release trigger
  push:
    tags:
      - 'v*.*.*'         # tags like v1.3.0
      - '*.*.*'          # tags like 1.3.0 (matches 1.3.0, 10.2.3, etc.)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and write npm auth for trusted workflow
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
          # use the built-in GITHUB_TOKEN; npm will accept it for a workflow
          # that you have registered as a trusted publisher
          auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build (optional)
        run: npm run build || echo "no build step"

      - name: Build fractal (optional)
        run: npm run fractal:build || echo "no build fractal step"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # for public packages:
          npm publish --access public
          # remove --access flag for private packages