name: Publish to npm (trusted workflow)

on:
  release:
    types: [published]   # keeps release trigger
  push:
    tags:
      - 'v*.*.*'         # tags like v1.3.0
      - '*.*.*'          # tags like 1.3.0 (matches 1.3.0, 10.2.3, etc.)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and auth for npm
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
          scope: '@bnuni'
          # use the built-in GITHUB_TOKEN; npm will accept it for a workflow
          # that you have registered as a trusted publisher
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Print package name/version
        run: |
          cat package.json
          node -e "const p=require('./package.json'); console.log('name:',p.name,'version:',p.version)"

      - name: Show npm config and whoami (debug)
        run: |
          npm config ls -l
          npm whoami || echo "whoami failed (no auth)"

      - name: Install dependencies
        run: npm ci

      - name: Build (optional)
        run: npm run build || echo "no build step"

      - name: Publish to npm (explicit registry)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish --access public --registry https://registry.npmjs.org